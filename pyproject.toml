[project]
name = "EBFM"
dynamic = [ "version" ]
authors = [ {name="EBFM Authors"} ]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mypy >= 1.0",
    "netCDF4 >= 1.7",
    "numpy >= 2.0",
    "pandas >= 2.0",
    "pandas-stubs >= 2.0",
    "pyproj",
    "scipy",
    "isodate >= 0.7.2",
]

[project.optional-dependencies]
dev = [
    "pre-commit >= 4.0",
    "pytest >= 7.0",
    "pytest-cov",
    "tox >= 4.0",
    "tox-gh-actions",
]

mpi = [
    "mpi4py >= 4.1",
]

cpl = [
    "EBFM[mpi]",
    "yac >= 3.8",
]

performance = [
    "numba >= 0.59",
]

gpu = [
    "EBFM[mpi]",
    # NVIDIA: numba >= 0.62 bundles numba.cuda (verified with numba 0.66 on A100).
    # AMD (MI300A / gfx942): GPU offload runs the same numba.cuda kernels via
    # numba-hip's pose_as_cuda(). numba-hip requires numba >= 0.58, < 0.62 and a
    # ROCm environment, so install it separately rather than through here.
    "numba >= 0.62",
]

[project.scripts]
ebfm = "ebfm.main:main"

[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
git_describe_command = "git describe --tags --dirty --match v*"
version_scheme = "post-release"
local_scheme = "node-and-date"

[tool.black]
line-length = 120
