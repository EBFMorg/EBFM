[tox]
min_version = 4.0
envlist = py{310,311,312,313,314}

[testenv]
extras =
    dev

[testenv:unit]
description = Run unit tests across Python versions
commands =
    pytest tests/ -v --cov=src/ebfm --cov-report=term-missing

[testenv:unit-mpi]
description = Run unit tests with MPI available (includes MPI-guarded tests)
extras =
    dev
    mpi
commands =
    pytest tests/ -v --cov=src/ebfm --cov-report=term-missing

[testenv:gpu-sim]
description = Run the GPU backend against NumPy on numba's CUDA simulator (no GPU required)
deps =
    numba >= 0.62
setenv =
    # Must be set before numba is imported, hence a dedicated environment: in a
    # full `pytest tests/` run another module may import numba first.
    NUMBA_ENABLE_CUDASIM = 1
commands =
    pytest tests/core/test_loop_snow_gpu.py -v

[testenv:examples]
description = Run examples
extras =
    dev
commands =
    ebfm --version
    ebfm --matlab-mesh examples/dem_and_mask.mat
    # Add more example commands here as needed

[testenv:examples-extra]
description = Run additional examples (more costly because of LFS and only recommended to be run locally)
extras =
    dev
commands =
    ebfm --netcdf-mesh examples/Greenland_CARRA2/grid.nc --start-time 1990-05-01T00:00:00 --end-time 1990-05-02T00:00:00

[testenv:type-check]
description = Run static type checking
deps =
    mypy
    types-setuptools
extras =
    dev
commands =
    mypy src/ebfm

[testenv:clean]
description = Clean up build and test artifacts
deps =
skip_install = true
allowlist_externals =
    rm
    find
commands =
    rm -rf build/
    rm -rf dist/
    rm -rf .pytest_cache/
    rm -rf .coverage
    find . -type d -name "__pycache__" -delete
    find . -type f -name "*.pyc" -delete

[gh-actions]
python =
    3.10: py310 # Python Version used on Levante
    3.11: py311 # Python Version used on LUMI
    3.12: py312 # Development version used on Ubuntu 24.04
    3.13: py313 # Development version used on Ubuntu 25.04
    3.14: py314 # Version provided by miniforge on Levante, used in TerraDT test case
